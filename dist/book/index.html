<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Book with Lion Barber · Freshelier</title>
  <link rel="canonical" href="https://barber-dresser.vercel.app/lions-croydon/book">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}main{max-width:420px;padding:32px;text-align:center}a{display:inline-block;padding:16px 24px;background:#c79b43;color:#111;text-decoration:none;border-radius:4px}p{line-height:1.6}</style>
</head>
<body>
  <main><h1>Lion Barber</h1><p>Opening your Freshelier booking experience…</p><a id="booking" href="https://barber-dresser.vercel.app/lions-croydon/book">Continue to booking ↗</a></main>
  <script>
    const destination = new URL("https://barber-dresser.vercel.app/lions-croydon/book");
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    document.getElementById("booking").href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
